<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- SEO -->
    <title>KrishiRakshak — Farm Risk Intelligence</title>
    <meta name="description" content="AI-powered early-warning and advisory system for Indian farmers. Real-time weather alerts, mandi prices, distress scoring, and government scheme matching in 5 regional languages." />
    <meta name="keywords" content="farmer advisory, mandi prices, weather alerts, crop yield, KCC loan, PMFBY, krishi, rakshak, kishirakshak" />
    <meta name="author" content="KrishiRakshak" />

    <!-- PWA / Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4a7c59" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="KrishiRakshak" />

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png" />
    <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="KrishiRakshak — Farm Risk Intelligence" />
    <meta property="og:description" content="AI-powered early-warning system for smallholder Indian farmers." />
    <meta property="og:image" content="/icons/icon-512.png" />
    <meta property="og:type" content="website" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(reg => {
              console.log('[KrishiRakshak SW] Registered, scope:', reg.scope);
              // Check for updates every 60s
              setInterval(() => reg.update(), 60000);
            })
            .catch(err => console.warn('[KrishiRakshak SW] Registration failed:', err));
        });
      }
    </script>
  </body>
</html>
