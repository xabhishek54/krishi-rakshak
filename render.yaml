services:
  - type: web
    name: krishirakshak-api
    runtime: python
    region: singapore # or frankfurt / oregon (100% free)
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard to your Supabase PostgreSQL URL
